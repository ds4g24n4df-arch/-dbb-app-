# App 的名字、标识、版本, 只在这里改; app/build.gradle.kts 读这个文件

# App 名: 显示在手机桌面图标下面, 可以用中文
appName=店帮帮AI

# App 标识: 留空时第一次编译会自动生成一个不和别的 App 重复的, 并写回这里.
# 生成后不要再改: 手机凭它认是不是同一个 App, 改了会装成另一个 App, 原来存的数据就找不回了
applicationId=

# 版本: 每次给用户手机装新版前把 versionCode 加 1 (只能变大), versionName 是给人看的
versionCode=1
versionName=1.0

# 接口服务地址。这个 App 不自带服务端：它连的是已经发布的店帮帮AI 线上地址，
# 所以这里留空；换域名时改 res/values/strings.xml 里的 start_url。
apiHost=
