appName=店帮帮AI

# App 标识：包名一旦定下就**不能改** —— 安卓靠它认"这是不是同一个 App"。
# 留空的话构建脚本会随手生成一个随机的 → 每次编译都是新包名 →
# 装到手机上就变成"另一个 App"，永远覆盖不上（现场反馈的"又是一个独立 APP"就是这个）。
applicationId=cc.luxiaofei.app

# 版本：流水线会自动按编译次数往上加（1.24、1.25…），这里不用管
versionCode=2
versionName=1.1

# 接口服务地址。这个 App 不自带服务端：它连的是已经发布的店帮帮AI 线上地址，
# 所以这里留空；换域名时改 res/values/strings.xml 里的 start_url。
apiHost=
