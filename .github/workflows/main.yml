name: 编译安卓安装包

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 取出仓库里的代码
        uses: actions/checkout@v4

      - name: 装 Java 17（编译用）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Java 21（Gradle 用）
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 缓存依赖与签名钥匙
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            signing
          key: dbb-android-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            dbb-android-

      - name: 开始编译
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME_17_X64"

      - name: 把安装包放到可下载处
        uses: actions/upload-artifact@v4
        with:
          name: dbb-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
